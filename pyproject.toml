[build-system]
requires = ["setuptools", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "winepredict"
version = "1.0"
description = "A library for predicting wine prices using machine learning models."
authors = [
    { name="Chris Lawrence", email="chris@credenceanddecision.com" }
]
dependencies = [
    "numpy>=1.21",
    "pandas>=2.2,<3.0",
    "seaborn>=0.11",
    "matplotlib>=3.4",
    "scikit-learn>=0.24",
    "xgboost>=1.4",
    "lightgbm>=3.2",
    "statsmodels>=0.12",
    "catboost>=0.26",
    "openpyxl>=3.0",
    "requests>=2.25",
    "dask[dataframe]>=2021.6",
    "torch>=1.9",
    "torchvision>=0.10",
    "torchaudio>=0.9"
]

[tool.setuptools]
packages = ["winepredict"]

[project.urls]
homepage = "https://credenceanddecision.com/"
repository = "https://github.com/chris-lawrence-cd/winepredict"
